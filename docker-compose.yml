services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cin}
      POSTGRES_DB: ${POSTGRES_DB:-cin_planner}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cin} -d ${POSTGRES_DB:-cin_planner}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
